<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
:root{--ink:#0E1A3D;--ink-soft:#1C2C5C;--paper:#F6F4EE;--signal:#E8A33D;--line:#D8D2C0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;}
section{padding:60px 24px;max-width:640px;margin:0 auto;text-align:center;}
h1{font-size:clamp(28px,5vw,44px);font-weight:900;margin-bottom:24px;}
p{font-size:18px;color:var(--ink-soft);margin-bottom:20px;}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;margin-top:32px;text-align:right;}
.card h3{font-size:18px;margin-bottom:8px;}
.card p{font-size:15px;margin-bottom:0;}
footer{text-align:center;padding:24px;font-size:12px;color:var(--ink-soft);}
</style>
</head>
<body>
  <section>
    <h1>مرحباً بك</h1>
    <p>هذه الصفحة تحتوي على المعلومات التي تبحث عنها مباشرة، بدون أي خطوات إضافية.</p>

    <div class="card">
      <h3>المعلومة الأولى</h3>
      <p>اكتب هنا المحتوى الأول الذي تريد عرضه على الزائر.</p>
    </div>

    <div class="card">
      <h3>المعلومة الثانية</h3>
      <p>اكتب هنا المحتوى الثاني الذي تريد عرضه على الزائر.</p>
    </div>
  </section>
  <footer>© 2026 جميع الحقوق محفوظة.</footer>
</body>
</html>
